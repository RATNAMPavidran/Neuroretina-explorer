<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Neuroretina explorer</title>
<style>
:root{--bg:#F3E7D3;--card:#FBF4E6;--ink:#1A1414;--wine:#6D0F1F;--mut:#6b5a54;--line:#d9c8aa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1214;--card:#2a1c1f;--ink:#F3E7D3;--wine:#b04458;--mut:#b9a99a;--line:#4a3438;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1A1214;--card:#2a1c1f;--ink:#F3E7D3;--wine:#b04458;--mut:#b9a99a;--line:#4a3438;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,serif}
header{background:#6D0F1F;color:#F3E7D3;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}header h1{margin:0;font-size:1.15rem}header b{background:#1A1414;padding:4px 12px;border-radius:14px}
main{max-width:640px;margin:0 auto;padding:14px}
.row{display:flex;gap:8px;margin:0 0 10px}.btn{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--wine);padding:10px;border-radius:6px;font:inherit;cursor:pointer}.btn.on{background:#6D0F1F;color:#F3E7D3}
.how{background:#1A1414;color:#F3E7D3;border-radius:8px;padding:10px 12px;margin:0 0 10px;font-size:.95rem}.how b{color:#e8b4bc}
.fig{position:relative;background:#fff;border-radius:8px;overflow:hidden;border:1px solid var(--line)}.fig img{display:block;width:100%;height:auto}
.mask{position:absolute;left:0;top:0;bottom:3.5%;width:28.3%;background:#fff}
.b{position:absolute;left:28.3%;width:42%;cursor:pointer}.b:hover{background:rgba(109,15,31,.12)}.b.s{background:rgba(109,15,31,.28);outline:2px solid #6D0F1F}
.chip{position:absolute;left:1%;width:27%;transform:translateY(-50%);background:#6D0F1F;color:#F3E7D3;font:bold 12px/1.2 Georgia,serif;padding:4px 5px;border-radius:5px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--wine);border-radius:8px;padding:12px;margin:12px 0}
.q{font-size:1.25rem;font-weight:bold;margin:0 0 6px}.q span{color:var(--wine)}.fb{color:var(--mut);margin:4px 0}.big{font-size:2rem;color:var(--wine);margin:0}
.go{background:#6D0F1F;color:#F3E7D3;border:0;padding:10px 14px;border-radius:6px;font:inherit;cursor:pointer;width:100%}
input{width:100%;padding:10px;margin:0 0 8px;border:1px solid var(--wine);border-radius:6px;font:inherit;background:var(--bg);color:var(--ink)}table{width:100%;border-collapse:collapse;font-size:.95rem}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}.ok{color:#2e7d32}
</style></head><body>

const L=[["9","Nerve fiber layer",2.6,6.2,"Axons of the ganglion cells running towards the optic nerve."],["8","Ganglion cell layer",8.8,14.2,"Cell bodies of the ganglion cells. Their axons form the optic nerve."],["7","Inner plexiform layer",23,9.8,"Synapses between bipolar, amacrine and ganglion cells."],["6","Inner nuclear layer",32.8,14,"Cell bodies of bipolar, horizontal, amacrine and Müller cells."],["5","Outer plexiform layer",46.7,16.5,"Synapses between photoreceptors and bipolar / horizontal cells."],["4","Outer nuclear layer",63.3,10.4,"Nuclei (cell bodies) of the rods and cones."],["2","Photoreceptor layer",75,9.3,"Inner and outer segments of rods and cones, where light is captured."],["1","Pigment epithelium",84.3,8.5,"The RPE feeds photoreceptors, recycles visual pigment and eats worn-out discs."]];
const sh=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
let sel=-1,mode=0,gi=0,sc=0,fb="",tried=0,ord=sh([0,1,2,3,4,5,6,7]),pts=0;
function md(m){if(ph=="play"){if(m||gi>=8){mode=m;sel=-1;draw()}return}mode=m;sel=-1;gi=0;sc=0;er=0;fb="";tried=0;ord=sh(ord);draw()}
function tap(i){if(mode&&ph!="play"&&ph!="solo")return;sel=i;if(mode&&gi<8){if(i===ord[gi]){if(!tried){sc++;pts++}fb="✓ "+L[i][4];gi++;tried=0}else{fb="✗ That is the "+L[i][1].toLowerCase()+". Look again!";tried=1;er++}if(ph=="play")push()}draw()}
function draw(){document.getElementById("p").textContent=pts;b1.className="btn"+(mode?"":" on");b2.className="btn"+(mode?" on":"");
how.innerHTML=mode?'<div class="how">🎮 <b>How to play:</b> the layer names are hidden. A name appears below the drawing: tap that layer on the picture. Wrong? Just try again. 1 ⭐ per layer found at the first try.</div>':'<div class="how">🔍 <b>Explore:</b> tap any layer on the drawing to reveal its name and role. Notice the order: light enters from the <b>top</b> and has to cross all the layers before reaching the photoreceptors.</div>';
bd.innerHTML=L.map((l,i)=>'<div class="b'+(sel===i?" s":"")+'" style="top:'+l[2]+'%;height:'+l[3]+'%" onclick="tap('+i+')"></div>').join("")+(sel>=0&&(!mode||tried===0)?'<div class="chip" style="top:'+(L[sel][2]+L[sel][3]/2)+'%">'+L[sel][0]+". "+L[sel][1]+'</div>':"");
pn.innerHTML=mode&&(ph=="join"||ph=="wait")?scr():!mode?(sel>=0?"<b>"+L[sel][0]+". "+L[sel][1]+"</b><br>"+L[sel][4]:"👆 Tap a layer on the drawing."):(gi>=8?'<p class="big">'+sc+' / 8</p><p>All layers found!</p>'+(ph=="solo"?'<button class="go" onclick="md(1)">Play again</button>':'<p class="fb">✅ Result sent to your teacher ('+tend+' s). Wait for the ranking!</p>')+'':'<p class="q">Find the <span>'+L[ord[gi]][1]+'</span></p><p class="fb">'+fb+'</p><p class="fb">'+(gi+1)+' / 8</p>')}

/* ===== MODE CLASSE (Kahoot) ===== */
const DB="https://neuroretina-explorer-default-rtdb.europe-west1.firebasedatabase.app"; // ex: https://monprojet-default-rtdb.europe-west1.firebasedatabase.app
const PIN="1234"; // code d'accès de l'interface prof (à changer)
const LIVE=DB.indexOf("http")==0;
let ph="join",code="",nm="",pid="",er=0,t0=0,tend=0,poll=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function local(p,m,b){let d={};try{d=JSON.parse(localStorage.getItem("nr")||"{}")}catch(e){}let k=p.split("/"),o=d;
 if(m=="PUT"||m=="PATCH"){for(let i=0;i<k.length-1;i++)o=o[k[i]]=o[k[i]]||{};const l=k[k.length-1];o[l]=m=="PATCH"?Object.assign(o[l]||{},b):b;try{localStorage.setItem("nr",JSON.stringify(d))}catch(e){}return b}
 for(const x of k)o=o&&o[x];return o===undefined?null:o}
function api(p,m,b){return LIVE?fetch(DB.replace(/\/$/,"")+"/"+p+".json",{method:m||"GET",body:b!==undefined?JSON.stringify(b):undefined}).then(r=>r.json()):Promise.resolve(local(p,m,b))}
function scr(){return ph=="join"?'<p class="q">Join the class game</p><input id="ic" placeholder="Session code" maxlength="6" autocapitalize="characters"><input id="iname" placeholder="Your name" maxlength="30"><p class="fb" id="ierr"></p><button class="go" onclick="jn()">Join</button><p class="fb">or <a href="#" onclick="solo();return false">play solo</a> (no ranking)</p>':'<p class="q">Welcome, '+esc(nm)+' 👋</p><p class="fb">⏳ Waiting for your teacher to start the game…</p>'}
function solo(){ph="solo";sc=0;gi=0;er=0;tried=0;fb="";ord=sh(ord);draw()}
function jn(){code=ic.value.trim().toUpperCase();nm=iname.value.trim().slice(0,30);if(!code||!nm){ierr.textContent="Enter the code and your name.";return}
 api("s/"+code).then(s=>{if(!s){ierr.textContent="Unknown code.";return}pid=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  return api("s/"+code+"/p/"+pid,"PUT",{n:nm,sc:0,er:0,gi:0,d:0,t:null}).then(()=>{ph="wait";draw();pl()})}).catch(()=>{ierr.textContent="Connection error."})}
function pl(){clearInterval(poll);poll=setInterval(()=>api("s/"+code+"/st").then(st=>{if(ph=="wait"&&st=="play"){ph="play";mode=1;sc=0;gi=0;er=0;tried=0;fb="";sel=-1;ord=sh(ord);t0=Date.now();draw()}}).catch(()=>{}),2000)}
function push(){const d=gi>=8;if(d){tend=Math.round((Date.now()-t0)/1000);clearInterval(poll)}api("s/"+code+"/p/"+pid,"PATCH",{sc:sc,er:er,gi:gi,d:d?1:0,t:d?tend:null})}
/* ----- Interface prof : ouvrir la page avec ?prof ----- */
let rows=[];
function teacher(){if(prompt("Code enseignant ?")!==PIN){document.body.innerHTML="<p style='padding:20px'>Accès refusé</p>";return}
 document.querySelector("main").innerHTML='<div class="card"><p class="q">👩‍🏫 Espace enseignant</p>'+(LIVE?'':'<p class="fb">⚠️ Mode démo (Firebase non configuré) : fonctionne seulement entre onglets du même navigateur.</p>')+'<button class="go" onclick="ns()">➕ Nouvelle session</button><p class="big" id="tc"></p><p class="fb" id="ts"></p><div class="row"><button class="btn" onclick="ss(\'play\')">▶ Lancer</button><button class="btn" onclick="ss(\'end\')">⏹ Terminer</button><button class="btn" onclick="csv()">⬇ CSV</button></div></div><div class="card" id="tb"></div>';
 code=localStorage.getItem("nrcode")||"";tick();setInterval(tick,2000)}
function ns(){code=Math.random().toString(36).replace(/[^a-z]/g,"").slice(0,4).toUpperCase();localStorage.setItem("nrcode",code);api("s/"+code,"PUT",{st:"open",c:Date.now()}).then(tick)}
function ss(st){if(code)api("s/"+code+"/st","PUT",st).then(tick)}
function tick(){if(!code){tc.textContent="";ts.textContent="Créez une session, puis donnez le code aux étudiants.";return}
 api("s/"+code).then(s=>{tc.textContent="Code : "+code;if(!s){ts.textContent="Session introuvable.";return}
  ts.textContent={open:"🟡 Salle d'attente — les étudiants rejoignent",play:"🟢 Jeu en cours",end:"🔴 Terminé"}[s.st]||"";
  rows=Object.values(s.p||{}).sort((a,b)=>b.sc-a.sc||(b.d-a.d)||((a.t||9e9)-(b.t||9e9))||a.er-b.er);
  tb.innerHTML='<b>'+rows.length+' étudiant(s)</b><table><tr><th>#</th><th>Nom</th><th>Score</th><th>Erreurs</th><th>Avancée</th><th>Temps</th></tr>'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(r.n)+'</td><td><b>'+r.sc+'/8</b></td><td>'+r.er+'</td><td class="'+(r.d?"ok":"")+'">'+(r.d?"✓ fini":r.gi+"/8")+'</td><td>'+(r.t!=null?r.t+" s":"–")+'</td></tr>').join("")+'</table>'}).catch(()=>{ts.textContent="Erreur de connexion"})}
function csv(){const t="Rang;Nom;Score;Erreurs;Temps(s)\n"+rows.map((r,i)=>[i+1,'"'+String(r.n).replace(/"/g,'""')+'"',r.sc,r.er,r.t==null?"":r.t].join(";")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="resultats_"+code+".csv";a.click()}
if(/prof/.test(location.search+location.hash))teacher();else draw()

</script>

  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
  import {
    getDatabase
  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBFq8__PECUnUnFv7R5PeduRM3LD7FY2zg",
    authDomain: "neuroretina-explorer.firebaseapp.com",
    databaseURL: "https://neuroretina-explorer-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "neuroretina-explorer",
    storageBucket: "neuroretina-explorer.firebasestorage.app",
    messagingSenderId: "174560947172",
    appId: "1:174560947172:web:58604bc17f9dd47e9335f1",
    measurementId: "G-M2ZMFG8MTC"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const database = getDatabase(app);

  // Connexion anonyme du joueur
  window.firebaseAppReady = signInAnonymously(auth)
    .then((credential) => {
      console.log("✅ Firebase connecté !");
      console.log("UID du joueur :", credential.user.uid);

      // Objets disponibles pour la prochaine étape
      window.firebaseApp = app;
      window.firebaseAuth = auth;
      window.firebaseDatabase = database;
      window.firebaseUser = credential.user;

      return credential.user;
    })
    .catch((error) => {
      console.error("❌ Erreur de connexion Firebase :", error.code, error.message);
      throw error;
    });
</script>
